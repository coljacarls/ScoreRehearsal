name: Linux build

# Builds the Linux AppImage (x86_64). Run it manually or push to feature/linux-port to get a test build
# as workflow artifact. Releases attach the AppImage in release.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - feature/linux-port

jobs:
  build:
    # same runner as MuseScore's Linux CI: g++-14 is available and the glibc baseline matches upstream AppImages
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # git describe for the version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build pkg-config curl file \
            libasound2-dev libsndfile1-dev libvulkan-dev libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libfontconfig1-dev libdbus-1-dev libgtk-3-dev libnss3 desktop-file-utils
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets
          cache: true
          # same aqtinstall sources as MuseScore's own CI for Qt 6.11
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          py7zrversion: '@git+https://github.com/miurahr/py7zr.git'

      - name: Version
        run: |
          VERSION="$(git describe --tags --always | sed 's/^v//')"
          echo "SCOREREHEARSAL_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          export QT_DIR="$QT_ROOT_DIR"
          ./build.sh install Release

      - name: Package AppImage
        run: |
          export QT_DIR="$QT_ROOT_DIR"
          mkdir -p dist
          src/packaging/linux/make_appimage.sh build/Release/install "dist/ScoreRehearsal-$SCOREREHEARSAL_VERSION-x86_64.AppImage"
          (cd dist && sha256sum *.AppImage > "ScoreRehearsal-$SCOREREHEARSAL_VERSION-x86_64.AppImage.sha256")
          ls -lh dist

      - name: Smoke test
        # still running after the timeout (exit code 124) means the app started without crashing
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen MU_QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 dist/ScoreRehearsal-*.AppImage
          code=$?
          echo "exit code: $code"
          [ "$code" = 124 ] || [ "$code" = 0 ]

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ScoreRehearsal-linux-x86_64
          path: dist/*
          if-no-files-found: error
