# SPDX-License-Identifier: GPL-3.0-only
#
# Builds and publishes a release when a pull request is merged into main.
#
# The version comes from the pull request:
#   - an explicit version in the title, e.g. "Release v1.0.1", or
#   - a label release:major, release:minor or release:patch, which bumps the latest vX.Y.Z tag
# Pull requests with neither are merged without a release.
#
# The tag is created only after the build succeeded, on the merge commit.
#
# The Windows build creates the release; the Linux build then adds the AppImage to it.
#
# The release notes are the pull request description (write the new features, improvements and
# fixes there), followed by the notes GitHub generates (merged pull requests, full changelog).

name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          set -euo pipefail

          version=""
          if [[ "$PR_TITLE" =~ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
            echo "Version from pull request title: $version"
          else
            bump=""
            for label in $PR_LABELS; do
              case "$label" in
                release:major) bump=major ;;
                release:minor) [ "$bump" = major ] || bump=minor ;;
                release:patch) [ -n "$bump" ] || bump=patch ;;
              esac
            done

            if [ -z "$bump" ]; then
              echo "::notice::No version in the title and no release:* label - no release."
              exit 0
            fi

            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            latest="${latest:-v0.0.0}"
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
            echo "Version from label $bump on $latest: $version"
          fi

          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: windows-2025
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      SCOREREHEARSAL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets
          cache: true
          # same aqtinstall sources as MuseScore's own CI for Qt 6.11
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          py7zrversion: '@git+https://github.com/miurahr/py7zr.git'

      - name: Build
        shell: cmd
        run: |
          set "QT_DIR=%QT_ROOT_DIR%"
          call build.cmd install Release

      - name: Package
        shell: pwsh
        run: |
          $zip = "ScoreRehearsal-$env:SCOREREHEARSAL_VERSION-win64.zip"
          Compress-Archive -Path build/Release/install/* -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.SCOREREHEARSAL_VERSION }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          name: ScoreRehearsal ${{ env.SCOREREHEARSAL_VERSION }}
          body: ${{ github.event.pull_request.body }}
          generate_release_notes: true
          files: ${{ env.ZIP }}

  build-linux:
    # needs the release (and its tag) created by the Windows build; a failure here leaves the Windows
    # release in place and can be re-run on its own
    needs: [version, build]
    if: needs.version.outputs.version != ''
    # same runner as MuseScore's Linux CI: g++-14 is available and the glibc baseline matches upstream AppImages
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      SCOREREHEARSAL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             g++-14 cmake ninja-build pkg-config curl file             libasound2-dev libsndfile1-dev libvulkan-dev libgl1-mesa-dev libglu1-mesa-dev             libxkbcommon-dev libxkbcommon-x11-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0             libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1             libfontconfig1-dev libdbus-1-dev libgtk-3-dev libnss3 desktop-file-utils
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.2
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets
          cache: true
          # same aqtinstall sources as MuseScore's own CI for Qt 6.11
          aqtsource: git+https://github.com/miurahr/aqtinstall.git
          py7zrversion: '@git+https://github.com/miurahr/py7zr.git'

      - name: Build
        run: |
          export QT_DIR="$QT_ROOT_DIR"
          ./build.sh install Release

      - name: Package AppImage
        run: |
          export QT_DIR="$QT_ROOT_DIR"
          mkdir -p dist
          src/packaging/linux/make_appimage.sh build/Release/install "dist/ScoreRehearsal-$SCOREREHEARSAL_VERSION-x86_64.AppImage"
          (cd dist && sha256sum *.AppImage > "ScoreRehearsal-$SCOREREHEARSAL_VERSION-x86_64.AppImage.sha256")
          ls -lh dist

      - name: Smoke test
        # still running after the timeout (exit code 124) means the app started without crashing
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen MU_QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 20 dist/ScoreRehearsal-*.AppImage
          code=$?
          echo "exit code: $code"
          [ "$code" = 124 ] || [ "$code" = 0 ]

      - name: Add AppImage to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$SCOREREHEARSAL_VERSION" dist/* --clobber
