<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- 1:1 mapping of CSS pixels and Qt device independent pixels -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1f5d8c">
    <meta name="color-scheme" content="dark light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ScoreRehearsal">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ScoreRehearsal</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        :root {
            --bg: #ffffff;
            --fg: #1c2b36;
            --accent: #1f5d8c;
            --accent-fg: #ffffff;
            --muted: #5b6b78;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #14181c;
                --fg: #e8eef2;
                --accent: #3d8cc4;
                --accent-fg: #0b1218;
                --muted: #93a3af;
            }
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        [hidden] { display: none !important; }

        #screen { position: fixed; inset: 0; }

        .page {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
            text-align: center;
            background: var(--bg);
        }
        .page img { width: 96px; height: 96px; border-radius: 22px; }
        .page h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
        #status { color: var(--muted); min-height: 1.4em; }
        progress { width: min(320px, 70vw); height: 6px; accent-color: var(--accent); }

        button {
            font: inherit;
            border: 0;
            border-radius: 10px;
            padding: 12px 24px;
            min-height: 44px;
            background: var(--accent);
            color: var(--accent-fg);
            cursor: pointer;
        }

        /* The big button over the app: sound needs a tap */
        #start {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0;
            background: color-mix(in srgb, var(--bg) 80%, transparent);
            color: var(--fg);
            font-size: 1.5rem;
            backdrop-filter: blur(6px);
        }
        #start span {
            background: var(--accent);
            color: var(--accent-fg);
            padding: 18px 40px;
            border-radius: 14px;
        }

        #update {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 8px 8px 16px;
            border-radius: 12px;
            background: var(--fg);
            color: var(--bg);
            box-shadow: 0 4px 16px rgba(0, 0, 0, .3);
        }
    </style>
</head>
<body>
    <main id="screen" hidden></main>

    <section id="splash" class="page">
        <img src="icons/icon-192.png" alt="" width="96" height="96">
        <h1>ScoreRehearsal</h1>
        <progress id="progress" max="1"></progress>
        <div id="status" role="status">Loading…</div>
        <noscript>JavaScript is needed to run ScoreRehearsal.</noscript>
    </section>

    <button id="start" hidden aria-label="Start"><span>Tap to start</span></button>

    <section id="error" class="page" hidden>
        <h1>ScoreRehearsal cannot start</h1>
        <div id="error-text"></div>
        <button onclick="location.reload()">Reload</button>
    </section>

    <div id="update" hidden role="status">
        <span>A new version is ready.</span>
        <button id="update-button">Update</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
